# Stage 5 only: explicit pure-function policy, NOT loaded by main.py/config.yaml.
# Caller must also supply confirmed, fresh Paper state and effective account hard limits.
policy_version: paper-risk-admission/v1
mode: paper_only
enabled: true
allowed_symbols: [SOLUSDT]
allowed_exchanges: [BINANCE_USDT_M]
allowed_risk_sources: [paper-ledger-snapshot/v1]
allowed_evidence_verifiers: [paper-structure-review/v1]
required_data: [market_price, structure, volatility, btc_reference, eth_reference]
max_market_age_seconds: 15
max_structure_age_seconds: 300
max_account_age_seconds: 5
max_exchange_age_seconds: 3600
max_cost_age_seconds: 300
max_scorecard_age_seconds: 30
decision_ttl_seconds: 5
max_holding_assumption_seconds: 86400
minimum_data_coverage: 0.8
minimum_score_coverage: 1
minimum_total_score: 60
minimum_net_rr: 1.5
max_loss_per_trade_usdt: 5
daily_loss_limit_usdt: 20
max_trades_per_day: 3
max_consecutive_losses: 2
max_positions: 1
max_leverage: 5
max_margin_ratio: 0.2
max_margin_usdt: 100
max_position_notional_usdt: 500
max_position_quantity: 100
max_risk_fraction_of_equity: 0.01
minimum_risk_budget_usdt: 0.5
btc_crash_3m_pct: -0.8
max_volatility_pct: 3
max_spread_bps: 20
max_entry_deviation_bps: 50
minimum_entry_fee_rate: 0.0005
minimum_exit_fee_rate: 0.0005
minimum_entry_slippage_bps: 10
minimum_exit_slippage_bps: 10
maximum_entry_slippage_bps: 30
maximum_exit_slippage_bps: 30
dimension_floors:
  - {dimension: direction_confidence, minimum: 55}
  - {dimension: entry_quality, minimum: 65}
  - {dimension: stop_loss_quality, minimum: 80}
  - {dimension: take_profit_quality, minimum: 75}
  - {dimension: rr_quality, minimum: 50}
  - {dimension: position_quality, minimum: 50}
  - {dimension: execution_clarity, minimum: 80}
tiers:
  - {name: S, minimum_total: 85, risk_fraction: 1, max_notional_equity_ratio: 1, minimum_net_rr: 2}
  - {name: A, minimum_total: 75, risk_fraction: 0.75, max_notional_equity_ratio: 0.75, minimum_net_rr: 2}
  - {name: B, minimum_total: 65, risk_fraction: 0.5, max_notional_equity_ratio: 0.5, minimum_net_rr: 1.5}
  - {name: C, minimum_total: 55, risk_fraction: 0.25, max_notional_equity_ratio: 0.25, minimum_net_rr: 1.5}
markets:
  - {regime: trend, allowed: true, risk_fraction: 1, minimum_net_rr: 2}
  - {regime: range, allowed: true, risk_fraction: 0.5, minimum_net_rr: 1.5}
  - {regime: high_volatility, allowed: false, risk_fraction: 0.25, minimum_net_rr: 2}
  - {regime: unknown, allowed: false, risk_fraction: 0, minimum_net_rr: 2}
